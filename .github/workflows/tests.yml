name: acp-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: python3 -m pip install pytest

      - name: Run ACP unit/protocol/integration tests
        run: python3 -m pytest tests/ -q

      - name: Run adversarial attack tests
        run: python3 tests/test_attack.py
